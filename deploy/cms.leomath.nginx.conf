# /etc/nginx/conf.d/cms.leomath.conf
# Computational Mechanics Solver at cms.leomath.cn, proxied to the Docker container
# on 127.0.0.1:8765. Coexists with LeoMath (leomath.cn) and Leo Tree
# (tree.leomath.cn) on the same nginx: server_name decides.
# The app checks the Origin header against Host, so Host must be passed through.
# After installing: certbot --nginx -d cms.leomath.cn
server {
    listen 80;
    listen [::]:80;
    server_name cms.leomath.cn;

    # Project files and avatar uploads.
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Static solves and PDF reports can take a while on large models.
        proxy_read_timeout 120s;
    }
}
